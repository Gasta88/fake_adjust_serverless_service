---
name: FASS CI CD

"on":
  push:
  workflow_dispatch:

env:
  BQ_PROJECT: ${{ vars.BQ_PROJECT || 'bondola-ai' }}
  BQ_DATASET: ${{ vars.BQ_DATASET || 'analytics' }}

jobs:
  terraform_unit_tests:
    runs-on: ubuntu-latest
    env:
      # Offline plan: a static token lets the provider configure without GCP auth.
      GOOGLE_OAUTH_ACCESS_TOKEN: offline-plan-token
    steps:
      - name: Checkout code into workspace directory
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3
      - name: Run terraform unittest
        run: |
          # Use local state for the offline plan; the runner is ephemeral.
          sed -i 's/^  backend "gcs" {}$/  backend "local" {}/' deploy/main.tf
          cd deploy
          terraform init
          terraform plan -out=plan.out
          terraform show -json plan.out > plan.json
          cd ../test/unit_tests
          python -m unittest check_terraform_plan.py
  python_unit_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code into workspace directory
        uses: actions/checkout@v4
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Use gcloud CLI
        run: gcloud info
      - name: Run python unittest
        run: |
          pip install -r orchestrator_func/requirements.txt
          pip install -r executor_func/requirements.txt
          python -m unittest discover -s orchestrator_func/test
          python -m unittest discover -s executor_func/test
  write_docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code into workspace directory
        uses: actions/checkout@v4
      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v2
      - name: Generate docs
        run: |
          cd docs
          pip install -r requirements.txt
          python infrastructure.py
  deploy_production:
    needs: [terraform_unit_tests, python_unit_tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code into workspace directory
        uses: actions/checkout@v4
      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Use gcloud CLI
        run: gcloud info
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.3
      - name: Deploy production tables
        run: |
          RAW_TABLE="$BQ_PROJECT:$BQ_DATASET.fass_raw"
          DAY_TABLE="$BQ_PROJECT:$BQ_DATASET.fass_day"
          if ! bq show "$RAW_TABLE" >/dev/null 2>&1; then
            bq mk \
            --table \
            "$RAW_TABLE" \
            "reportDay:DATE,adNetworkName:STRING(100),campaignName:STRING(100),creativeName:STRING(100),startDate:STRING(10),endDate:STRING(10),platform:STRING(10),installs:INT64,adSpend:FLOAT64,clicks:INT64,impressions:INT64,clickConvertionRate:FLOAT64,clickThroughRate:FLOAT64,impressionsConvertionRate:FLOAT64,limitAdTrackingInstalls:INT64,uninstalls:INT64,createdAt:TIMESTAMP" \
            --time_partitioning_field reportDay
          fi
          if ! bq show "$DAY_TABLE" >/dev/null 2>&1; then
            bq mk \
            --table \
            "$DAY_TABLE" \
            "reportDay:DATE,updatedAt:TIMESTAMP"
          fi
      - name: Deploy production infra
        run: |
          cd deploy
          terraform init -backend-config=prod.gcs.tfbackend
          terraform workspace select prod || terraform workspace new prod
          terraform apply --auto-approve --parallelism=1
